# What `./enchanter setup` produces. You do not write this by hand: every
# picture is a box you drew on a screenshot, every flow was recorded while the
# wizard drove the game. Shown here so you know what the knobs mean.

game_window: Black Desert        # window title fragment; lets me focus the game (xdotool)

targets:
  PRI: 15                        # failstack built before each PRI attempt
  DUO: 40                        # failstack built before each DUO attempt

# Recorded menu paths. Steps are {key: ...}, {click: picture}, {wait: seconds}.
# A click can be optional: true (skipped when the picture is not on screen).
flows:
  open_enhancement:              # normal view -> enhancement window + inventory
  - key: ','
  - click: templates/open_enhancement_2.png
  - key: i
  open_failstack_menu:           # enhancement window -> where Black Stones are consumed ([] if same window)
  - click: templates/open_failstack_menu_1.png
  add_failstack:                 # consume ONE Black Stone (+1 failstack)
  - click: templates/add_failstack_1.png
  close_failstack_menu:          # back to the enhancement window
  - click: templates/close_failstack_menu_1.png
  enhance:                       # press Enhance (+ confirm, marked optional)
  - click: templates/enhance_1.png
  - click: templates/enhance_2.png
    optional: true

anchors:
  enhancement_open: templates/enhancement_open.png   # proves the window is open

failstack:
  region: [195, 106, 50, 40]     # counter digits in the enhancement window [x, y, w, h]
  menu_region: [425, 276, 50, 40]  # counter inside the failstack menu (optional)
  max_overshoot: 3               # stop and ask rather than burn e.g. a 30 stack on a PRI

inventory_region: [705, 105, 530, 590]   # items are only searched (and clicked) in here

items:
- name: Deboreka Ring
  pri_count: 2                   # goal for the `pri` phase
  templates:
    BASE: templates/item_deboreka_ring_base.png
    PRI: templates/item_deboreka_ring_pri.png    # captured after the first PRI success
    DUO: templates/item_deboreka_ring_duo.png    # captured after the first DUO success
- name: Deboreka Earring
  pri_count: 1
  templates:
    BASE: templates/item_deboreka_earring_base.png

select_click: left               # mouse button that moves an inventory item into the slot

delays:
  after_click: 0.4
  after_key: 0.8
  after_failstack: 0.5
  after_enhance: 3.0
  result_timeout: 10.0

match_threshold: 0.85            # minimum picture-match confidence (0-1)

hotkeys:
  stop: f9
  pause: f10
