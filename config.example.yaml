# Example of what `python enchanter.py setup` writes to config.yaml.
# You normally never edit this by hand: every picture below is cropped by
# dragging a box on a screenshot during setup, and the failstack region is
# picked and OCR-verified the same way.

targets:
  PRI: 15      # failstack to build before a PRI attempt
  DUO: 40      # failstack to build before a DUO attempt

failstack:
  region: [860, 240, 60, 28]   # [x, y, w, h] of the counter digits (picked in setup)
  max_overshoot: 3             # stop instead of burning e.g. a 42 stack on a PRI
  verify_retries: 3

buttons:
  increase_failstack: {template: templates/increase_failstack.png}
  confirm_failstack:  {template: templates/confirm_failstack.png, optional: true}
  enhance:            {template: templates/enhance.png}
  confirm_enhance:    {template: templates/confirm_enhance.png, optional: true}

# Which mouse button moves an inventory item into the enhancement slot
# (setup tests this for you).
select_click: left

items:
  - name: Ogre Ring
    current: BASE
    target: DUO
    count: 2
    templates:
      BASE: templates/item_ogre_ring_base.png
      # PRI: captured automatically the first time a PRI succeeds during a run
  - name: Tungrad Earring
    current: BASE
    target: PRI
    count: 3
    templates:
      BASE: templates/item_tungrad_earring_base.png

delays:
  after_click: 0.4
  after_failstack: 0.6   # time for the counter to update after a stone
  after_enhance: 3.0     # enhancement animation
  result_timeout: 10.0

match_threshold: 0.85    # minimum picture-match confidence (0-1)

hotkeys:
  stop: f9
  pause: f10

# Only used by `python enchanter.py sim`.
sim:
  start_failstack: 0
  black_stones: 300
  success_rate: {PRI: 0.5, DUO: 0.35}
